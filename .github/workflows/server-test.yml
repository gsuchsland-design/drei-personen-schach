name: Server prüfen
on:
  push:
    paths: ['tools/server-test.txt']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server und Lobby prüfen
        run: |
          H=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/server.json | jq -r .host)
          echo "Server: $H"
          { curl -s -m 30 "https://$H/"; echo
          curl -s -m 30 "https://$H/lobby"; echo
          R=$(curl -s -m 30 -X POST "https://$H/lobby/offer" -H 'Content-Type: application/json' -d '{"kind":"live","code":"test01","host":"Servertest","seats":{"B":{"kind":"human","name":"Servertest"}},"rules":{"help":false}}')
          echo "$R"
          ID=$(echo "$R" | jq -r .id); KEY=$(echo "$R" | jq -r .key)
          curl -s -m 30 -X POST "https://$H/lobby/remove" -H 'Content-Type: application/json' -d "{\"id\":\"$ID\",\"key\":\"$KEY\"}"
          echo; } > tools/server-test-result.txt 2>&1
          cat tools/server-test-result.txt
          git config user.name "github-actions[bot]"; git config user.email "41898131+github-actions[bot]@users.noreply.github.com"
          git add tools/server-test-result.txt; git commit -m "Server-Prüfung: Ergebnis" || true; git push
