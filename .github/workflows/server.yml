name: Server auf Cloudflare veröffentlichen

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zugangsdaten prüfen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Das GitHub-Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Wrangler installieren
        run: npm ci || npm i
      - name: Veröffentlichen
        run: npx wrangler deploy
      - name: TURN-Zugang hinterlegen
        if: env.TURN_KEY_ID != '' && env.TURN_KEY_TOKEN != ''
        run: |
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_TOKEN" | npx wrangler secret put TURN_KEY_TOKEN
      - name: Adresse des Servers ermitteln
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain')
          URL="https://dreischach.$SUB.workers.dev/"
          echo "::notice title=SERVER::$URL"
          sleep 5
          echo "::notice title=STATUS::$(curl -s "$URL")"
