name: Server auf Cloudflare veröffentlichen

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zugangsdaten prüfen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Das GitHub-Secret CLOUDFLARE_API_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Wrangler installieren
        run: npm ci || npm i
      - name: Veröffentlichen
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            # Fehlermeldung als lesbaren Hinweis ausgeben (Farbcodes entfernen, auf eine Zeile kürzen)
            MSG=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -iE 'error|✘|code|authentication|subdomain|permission|account' | head -8 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=WRANGLER::$MSG"
            exit 1
          fi
      - name: TURN-Zugang hinterlegen
        if: env.TURN_KEY_ID != '' && env.TURN_KEY_TOKEN != ''
        run: |
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_TOKEN" | npx wrangler secret put TURN_KEY_TOKEN
      - name: Adresse des Servers ermitteln
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$ACC" ]; then
            ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain')
          HOST="dreischach.$SUB.workers.dev"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "::notice title=SERVER::https://$HOST/"
          sleep 5
          echo "::notice title=STATUS::$(curl -s "https://$HOST/")"
          T=$(curl -s "https://$HOST/turn")
          echo "::notice title=TURNCHECK::$(echo "$T" | jq -c '{relays:[.iceServers[]?|select(.username)|.urls|length],error}' 2>/dev/null || echo "$T" | cut -c1-200)"
      - name: Adresse ins Spiel eintragen (server.json)
        if: env.HOST != '' && !contains(env.HOST, 'null')
        working-directory: .
        run: |
          printf '{"host":"%s"}\n' "$HOST" > server.json
          if git diff --quiet -- server.json 2>/dev/null && git ls-files --error-unmatch server.json >/dev/null 2>&1; then
            echo "server.json ist aktuell."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.json
          git commit -m "Serveradresse für Fernpartien eintragen"
          git push
          # Seite neu bauen lassen (Pushes aus Workflows lösen das nicht immer aus)
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
